<style>
/* One quiet column on black. You type everything; nothing needs a mouse. */
:root{
  --bg:#000; --surface:#0a0a0c; --line:#1a1a1f;
  --ghost:#4d4d56; --dim:#74747e; --fg:#ececef;
  --accent:#a8c7fa; --bad:#e8696e;
  --kw:#c4a8ff; --st:#a3d9a5; --nu:#f2c47e; --fn:#8fd0ff; --op:#9a9aa4;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);-webkit-font-smoothing:antialiased}
#app{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px;max-width:880px;width:100%;margin:0 auto;font-size:13px;color:var(--dim)}
.logo{font-size:17px;color:var(--fg);font-weight:500;letter-spacing:-.01em}
.logo b{color:var(--accent);font-weight:500}
.logo i{font-style:normal;color:var(--dim)}
.prog{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.done{background:var(--accent)}
.dot.now{background:transparent;box-shadow:inset 0 0 0 1.5px var(--fg)}
.meta{display:flex;align-items:center;gap:16px;font-variant-numeric:tabular-nums}
.py{display:flex;align-items:center;gap:6px}
.py::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dim)}
.py[data-s="ready"]::before{background:var(--st)}
.py[data-s="failed"]::before{background:var(--bad)}
.py[data-s="loading"]::before{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

main{flex:1 1 auto;width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding-block:24px 40px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:lowercase;color:var(--dim);margin-bottom:34px;display:flex;gap:10px;flex-wrap:wrap}
.eyebrow span+span::before{content:"·";margin-right:10px;color:var(--ghost)}
.blocks{display:flex;flex-direction:column;gap:30px}
.block{display:flex;flex-direction:column;gap:10px;transition:opacity .25s ease;min-width:0}
.block .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ghost)}
.block.next{opacity:.38}
.block.past{opacity:.5}
.block.past .lab,.block.next .lab{color:var(--ghost)}
.block.active .lab{color:var(--dim)}

.tx{position:relative;white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere}
.prose .tx{font-size:clamp(17px,2.4vw,22px);line-height:1.62}
.code .tx{font-size:clamp(15px,2vw,19px);line-height:1.75;white-space:pre;overflow-wrap:normal}
.code .pane{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 22px;overflow-x:auto}
.ch.ghost{color:var(--ghost)}
.ch.blank{color:var(--ghost);opacity:.75}
.ch.ok{color:var(--fg)}
.ch.rec{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:5px;text-decoration-thickness:1px}
.ch.bad{color:var(--bad);text-decoration:underline;text-underline-offset:5px}
.ch.nl{font-size:.7em;opacity:.55}
.ch.nl.ok{opacity:0}
.ch.free{color:var(--ghost);font-style:italic}
.ch.free.has{color:var(--fg);font-style:normal;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:5px}
.t-kw.ok{color:var(--kw)}.t-st.ok,.t-st.free.has{color:var(--st)}.t-nu.ok{color:var(--nu)}.t-fn.ok{color:var(--fn)}.t-op.ok,.t-pu.ok{color:var(--op)}.t-cm.ok{color:var(--dim)}
.caret{position:absolute;left:0;top:0;width:2px;background:var(--accent);border-radius:1px;transition:left .07s linear,top .07s linear;pointer-events:none}
.caret.idle{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.shake{animation:shake .18s linear}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

.cue{font-size:13px;color:var(--dim);display:flex;gap:8px;align-items:center;min-height:20px}
.cue kbd,.keys kbd{font-family:var(--mono);font-size:12px;color:var(--fg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface)}
.out{display:flex;flex-direction:column;gap:2px;font-size:16px;line-height:1.6;padding-left:2px}
.out .o{white-space:pre-wrap;overflow-wrap:anywhere}
.out .o::before{content:"› ";color:var(--ghost)}
.out .e{color:var(--bad)}
.say{font-size:clamp(15px,1.9vw,17px);line-height:1.6;color:var(--accent);max-width:64ch}
.say.dimmer{color:var(--dim)}
.res{display:flex;gap:36px;flex-wrap:wrap;margin-top:6px;font-variant-numeric:tabular-nums}
.res div{display:flex;flex-direction:column;gap:2px}
.res small{font-size:12px;color:var(--dim)}
.res b{font-size:30px;font-weight:400;color:var(--accent)}
.res b.plain{color:var(--fg)}
.rise{animation:rise .3s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}

.edwrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.edwrap.on{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.CodeMirror.cm-s-flow{height:auto;min-height:150px;background:transparent;color:var(--fg);font-family:var(--mono);font-size:clamp(15px,2vw,19px);line-height:1.75;padding:12px 8px}
.cm-s-flow .CodeMirror-gutters{background:transparent;border:0}
.cm-s-flow .CodeMirror-linenumber{color:var(--ghost)}
.cm-s-flow .CodeMirror-cursor{border-left:2px solid var(--accent)}
.cm-s-flow .CodeMirror-selected,.cm-s-flow.CodeMirror-focused .CodeMirror-selected{background:#1d2433}
.cm-s-flow .cm-keyword{color:var(--kw)}.cm-s-flow .cm-string{color:var(--st)}.cm-s-flow .cm-number{color:var(--nu)}
.cm-s-flow .cm-builtin{color:var(--fn)}.cm-s-flow .cm-variable,.cm-s-flow .cm-def{color:var(--fg)}
.cm-s-flow .cm-operator,.cm-s-flow .cm-punctuation{color:var(--op)}.cm-s-flow .cm-comment{color:var(--dim)}
.cm-s-flow .CodeMirror-matchingbracket{color:var(--fg)!important;text-decoration:underline}
.cm-s-flow .CodeMirror-placeholder{color:var(--ghost)}
.cm-s-flow .err-line{background:color-mix(in srgb,var(--bad) 12%,transparent)}

.keys{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;padding-block:18px 24px;font-size:12px;color:var(--ghost)}
.keys span{display:flex;align-items:center;gap:7px}
.end h1{font-size:clamp(28px,5vw,44px);font-weight:400;margin:0 0 10px;letter-spacing:-.02em}
.end p{color:var(--dim);margin:0 0 30px;font-size:16px;line-height:1.6;max-width:60ch}

.choices{display:flex;flex-direction:column;gap:10px;max-width:560px}
.choice{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s ease,background .15s ease}
.choice.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--surface)}
.choice kbd{font-family:var(--mono);font-size:13px;color:var(--fg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 7px;background:var(--surface)}
.choice div{display:flex;flex-direction:column;gap:4px}
.choice b{font-weight:500;font-size:17px}
.choice small{color:var(--dim);font-size:13px;line-height:1.5}
.why{color:var(--fg)!important;font-size:17px!important}
.goal-in{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--fg);font:inherit;font-family:var(--mono);font-size:17px;outline:none}
.goal-in:focus{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.writer-note{margin-top:26px;color:var(--ghost);font-size:13px;font-family:var(--mono)}
.writer-note kbd{font-family:var(--mono);font-size:12px;color:var(--fg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--surface)}
.wmlist{display:flex;flex-direction:column;gap:2px;max-width:560px;max-height:min(56vh,520px);overflow-y:auto;padding:2px}
.wmrow{display:flex;justify-content:space-between;gap:12px;padding:8px 14px;border:1px solid transparent;border-radius:8px;font-family:var(--mono);font-size:14px;color:var(--dim);cursor:pointer}
.wmrow.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--surface);color:var(--fg)}
.wmrow small{color:var(--ghost);font-size:12px}
.qbar{height:2px;background:var(--line);border-radius:1px;margin:-18px 0 30px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.qtask{margin:0 0 6px;font-size:clamp(16px,2.2vw,20px);line-height:1.55;color:var(--fg)}
.ansrow{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:clamp(16px,2.2vw,20px)}
.ansrow span{color:var(--ghost)}
.ans{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:inherit;font-family:var(--mono);padding:8px 0;caret-color:var(--accent);outline:none}
.ans:focus{border-bottom-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.ans::placeholder{color:var(--ghost)}
.ans:disabled{color:var(--dim)}
.shown{font-weight:500;color:var(--fg)}
.map{display:flex;flex-direction:column;gap:2px;margin:6px 0 24px;max-width:420px}
.mrow{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:12px;padding:5px 0;font-size:15px;color:var(--dim)}
.mrow i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.mrow small{font-size:12px;color:var(--ghost)}
.mrow.known{color:var(--fg)}.mrow.known i{background:var(--accent)}
.mrow.learn i{box-shadow:inset 0 0 0 1.5px var(--dim);background:transparent}
.mrow.gap{color:var(--fg)}.mrow.gap i{box-shadow:inset 0 0 0 1.5px var(--accent);background:transparent}.mrow.gap small{color:var(--accent)}
.note{font-size:13px!important;color:var(--ghost)!important}
.breathe{animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{50%{opacity:.45}}
.veil{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);color:var(--fg);font-size:15px;z-index:5;cursor:pointer}
@media (prefers-reduced-motion:reduce){.caret{transition:none}.caret.idle,.rise,.shake,.py::before,.breathe{animation:none}}
</style>

<div id="app">
  <header class="top">
    <div class="logo">flow<b>.</b><i>py</i></div>
    <div class="prog"><span id="lname"></span><div class="dots" id="dots"></div></div>
    <div class="meta"><span id="xp">0 xp</span><span class="py" id="py" data-s="loading">python</span></div>
  </header>
  <main id="stage" aria-live="polite"></main>
  <footer class="keys" id="keys"></footer>
</div>
<div class="veil" id="veil" hidden>click anywhere, then keep typing</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/display/placeholder.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- logging: every failure lands in console + window.__flowpyLog ---------- */
const LOG = []; window.__flowpyLog = LOG;
function log(level, msg, extra) {
  LOG.push({ t: new Date().toISOString(), level, msg, extra });
  (level === 'error' ? console.error : console.log)('[flowpy]', msg, extra ?? '');
  if (level === 'error' || level === 'warn' || level === 'event')
    fetch('/api/log', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Flowpy': '1' },
      body: JSON.stringify({ level, msg, extra }) }).catch(() => {});
}
window.addEventListener('error', e => log('error', 'page error', e.message));
window.addEventListener('unhandledrejection', e => log('error', 'unhandled promise', String(e.reason && e.reason.message || e.reason)));

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v; else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const $ = id => document.getElementById(id);
const kbd = t => h('kbd', { text: t });

/* ---------- the server: runs Python, saves progress, writes lessons ---------- */
async function api(method, path, body) {
  const headers = { 'X-Flowpy': '1' };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  const r = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  let data = null; try { data = await r.json(); } catch {}
  if (!r.ok) { const e = new Error((data && (data.message || data.error)) || 'HTTP ' + r.status); e.status = r.status; e.data = data; throw e; }
  return data;
}
const pyState = { status: 'loading', writer: null };
const health = api('GET', '/api/health')
  .then(hl => { pyState.status = 'ready'; pyState.writer = hl.writer; return hl; })
  .catch(e => { pyState.status = 'failed'; log('error', 'server unreachable', e.message); return null; })
  .finally(() => { const el = $('py'); el.dataset.s = pyState.status; el.textContent = pyState.status === 'failed' ? 'offline' : 'python'; });
async function runPy(code) {
  try { return await api('POST', '/api/run', { code }); }
  catch (e) { log('error', 'run failed', e.message); return { ok: false, offline: true, out: '', err: 'The flow.py server is not answering.', line: null }; }
}

/* ---------- tiny Python highlighter for the typed code ---------- */
const KW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const BI = new Set('print len range input str int float list dict type sum min max sorted abs round'.split(' '));
function tokenize(src) {
  const cls = new Array(src.length).fill(''); let i = 0;
  while (i < src.length) {

function cue(el, keys, label) { el.innerHTML = ''; if (keys) el.append(...keys.map(kbd), label); }

function go(i) { if (!ROUNDS.length) return; S.idx = Math.max(0, Math.min(ROUNDS.length - 1, i)); S.prog.at = { topic: S.lesson.topic, lvl: S.idx + 1 }; save(); startRound(); }

function startRound() {

function activate(i) {
  R.ti = i;

  if (R.rd.lvl < 4) {

function showOut(res) {

function friendly(res) {

  if (res.timeout) return 'That never finished. Make sure your loop has a way to stop.';
  const e = res.err || '';
  if (/NameError/.test(e)) return "Python doesn't know that name. If it's text, it needs quotes.";
  if (/SyntaxError|EOL|unterminated|IndentationError/.test(e)) return "Python couldn't read that. Check that every quote and bracket has a partner.";

let running = false;
async function run() {

  if (rd.lvl === 4 && !code.trim()) { running = false; return; }
  const slowRun = setTimeout(() => { cue(R.cueEl, null); R.cueEl.textContent = 'running…'; R.cueEl.classList.add('breathe'); }, 300);
  const res = await runPy(code);
  clearTimeout(slowRun); R.cueEl.classList.remove('breathe');

  showOut(res);

  let problem = res.ok ? (rd.check ? rd.check(res, code) : '') : friendly(res);
  if (problem) {

function finish(res) {

  const doneLvls = S.prog.done[topic] || (S.prog.done[topic] = []);

  const nt = S.idx < ROUNDS.length - 1 ? null : nextTopic(topic);

/* ---------- start screen + placement check ---------- */

let Q = null;        // current question runtime
let pick = 0;        // start screen selection
const norm = s => String(s).trim().replace(/^["']|["']$/g, '').replace(/\s+/g, '');

function askQuestion() {

async function submitAnswer(skip) {
  const q = Q.q, qz = S.quiz;
  let ok = false, shown = q.a;

    const code = Q.cm.getValue(); if (!code.trim()) return;
    const res = await runPy(code);
    shown = res.ok ? (res.out || '(nothing printed)') : res.err;
    ok = res.ok && q.check(res.out);
    if (!ok) { // let them retry the write question; Tab gives up
      Q.fb.innerHTML = '';
      Q.fb.append(h('div', { class: 'out' }, ...shown.split('\n').map(l => h('div', { class: 'o' + (res.ok ? '' : ' e'), text: l }))),
        h('p', { class: 'say rise', text: res.ok ? 'Not quite. I need 1, 2 and 3 on separate lines. Try again, or tab if you are not sure.' : 'That errored. Try again, or tab if you are not sure.' }));
      Q.cm.focus(); return;

function advanceQuiz(last) {

function placed(stopped) {
  S.phase = 'placed'; stage.innerHTML = '';
  const rs = S.quiz.results, status = {};
  // stopping early = assume the unanswered topics are new
  for (const t of TOPICS) {
    const mine = rs.filter(r => r.topic === t);
    status[t] = !mine.length ? 'learn' : mine.every(r => r.ok) ? 'known' : 'learn';
  }
  const gap = TOPICS.find(t => status[t] !== 'known') || null;
  const known = TOPICS.filter(t => status[t] === 'known').length;
  S.placement = { status, gap, stopped: !!stopped, answered: rs.length, secs: Math.round((performance.now() - S.quiz.t0) / 1000) };
  S.prog.placement = S.placement; S.prog.known = TOPICS.filter(t => status[t] === 'known'); save();
  event({ type: 'placement', ...S.placement, answers: rs });
  log('info', 'placement', S.placement);
  const map = h('div', { class: 'map' });
  TOPICS.forEach(t => map.append(h('div', { class: 'mrow ' + status[t] + (t === gap ? ' gap' : '') },
    h('i', {}), h('span', { text: t }), h('small', { text: t === gap ? 'start here' : status[t] === 'known' ? 'got it' : status[t] === 'learn' ? 'to learn' : 'not checked' }))));
  const head = known === 0 ? 'Starting from the top.' : !gap ? 'You know all of these.' : `You already know ${known} of ${TOPICS.length}.`;
  const sub = !gap ? "We'll go past the basics." : known ? `We'll skip those and start at ${gap}.` : `We'll start at ${gap}.`;
  const kids = [h('h1', { text: head }), h('p', { text: sub + (stopped && rs.length < QUIZ.length ? ' You stopped early, so the rest count as new.' : '') }), map];
  stage.append(h('div', { class: 'end rise' }, ...kids));

}
function startFromPlacement() {
  const t = (S.placement && S.placement.gap) || firstTopic();
  if (t) startTopic(t, 1); else teacherNext();
}

function quizKey(e) {
  const p = S.phase, enter = e.key === 'Enter', cmd = e.metaKey || e.ctrlKey;
  if (p === 'boot') return;
  if (p === 'loading') { if (e.key === 'Escape') { e.preventDefault(); home(); } return; }
  if (p === 'goal') {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); return saveGoal(); }
    if (e.key === 'Escape') { e.preventDefault(); const b = S.goal.back; S.goal = null; return b(); }
    return;
  }
  if (p === 'models') {
    if (!MS || !MS.list) { if (e.key === 'Escape') { e.preventDefault(); const b = MS && MS.back; MS = null; (b || home)(); } return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); MS.i = (MS.i + (e.key === 'ArrowDown' ? 1 : -1) + MS.list.length) % MS.list.length; return paintModels(); }

  if (p === 'fail') {
    if (e.key === 'm' || e.key === 'M') { e.preventDefault(); const f = S.fail; return modelScreen(f.retry); }
    if (e.key === 'Escape') { e.preventDefault(); return home(); }
    if (enter && !e.repeat) { e.preventDefault(); return S.fail.retry(); }
    return;
  }
  if (p === 'welcome') {
    if (e.key === '1' || e.key === '2' || e.key === '3') { e.preventDefault(); return chooseWelcome(+e.key - 1); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); pick = ((pick % 3) + (e.key === 'ArrowDown' ? 1 : 2)) % 3; return welcomeScreen(); }
    if (enter) { e.preventDefault(); return chooseWelcome(pick); }
    return;
  }
  if (p === 'start') {
    if (e.key === '1' || e.key === '2') { e.preventDefault(); return choose(+e.key - 1); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); pick = pick ? 0 : 1; return startScreen(); }
    if (enter) { e.preventDefault(); return choose(pick); }
    return;
  }
  if (e.key === 'Escape') { e.preventDefault(); return (p === 'quiz' || p === 'qfeedback') ? placed(true) : home(); }
  if (p === 'quiz') {
    if (e.key === 'Tab') { e.preventDefault(); return submitAnswer(true); }
    if (enter && Q.write) { if (cmd) { e.preventDefault(); submitAnswer(false); } return; }
    if (enter) { e.preventDefault(); return submitAnswer(false); }
    return;
  }
  if (!enter || e.repeat) return;
  e.preventDefault();
  if (p === 'qfeedback') advanceQuiz(Q.last);
  else if (p === 'placed') startFromPlacement();
}

/* ---------- keyboard: the only controller ---------- */
window.addEventListener('keydown', e => {
  if (QPHASES.has(S.phase)) { quizKey(e); return; }
  if (e.key === 'Escape') { e.preventDefault(); if (S.phase !== 'end') startRound(); return; }
  if (e.altKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); go(S.idx + (e.key === 'ArrowRight' ? 1 : -1)); return; }
  const enter = e.key === 'Enter', cmdEnter = enter && (e.metaKey || e.ctrlKey);
  // ⌘↵ always runs. Plain ↵ and ⇧↵ are new lines while you type.
  if (S.phase === 'edit') { if (cmdEnter) { e.preventDefault(); run(); } return; }
  if (S.phase === 'typing') {
    const t = R.typers[R.ti]; if (!t) return;
    if (cmdEnter) {
      e.preventDefault();
      if (R.ti === R.typers.length - 1 && R.rd.lvl < 4 && t.tryFinish() && S.phase === 'ready') run();
      return;
    }
    if (!R.start && e.key.length === 1) R.start = performance.now();
    if (t.key(e)) e.preventDefault();
    return;
  }
  if (!enter || e.repeat) return;
  e.preventDefault();
  if (S.phase === 'ready') { if (cmdEnter) run(); }
  else if (S.phase === 'result') next();
  else if (S.phase === 'end') home();
}, true);

const veil = $('veil');
const syncVeil = () => { veil.hidden = document.hasFocus(); };
window.addEventListener('blur', syncVeil); window.addEventListener('focus', syncVeil);
veil.addEventListener('click', () => { window.focus(); veil.hidden = true; if (S.phase === 'edit' && R.cm) R.cm.focus(); if (S.phase === 'quiz' && Q) (Q.cm || Q.input).focus(); });
window.addEventListener('resize', () => R && R.typers.forEach(t => t.place()));
document.fonts && document.fonts.ready.then(() => R && R.typers.forEach(t => t.place()));

(async function boot() {
  stage.append(h('div', { class: 'end rise' }, h('p', { class: 'breathe', text: 'waking up…' })));
  const hl = await health;
  if (!hl) {
    stage.innerHTML = '';
    stage.append(h('div', { class: 'end rise' }, h('h1', { text: "the server isn't running" }),
      h('p', { text: 'Start it with  make flowpy-app  and reload this page.' })));
    return;
  }
  try {
    const [cur, prog] = await Promise.all([api('GET', '/api/curriculum'), api('GET', '/api/progress')]);
    CURR = cur.topics.concat(cur.extra || []);
    S.prog = { ...blankProg(), ...(prog || {}) };
    S.prog.profile = S.prog.profile || {}; S.prog.known = S.prog.known || []; S.prog.done = S.prog.done || {};
  } catch (e) { log('error', 'boot failed', e.message); }
  stage.innerHTML = '';
  home();
})();
setTimeout(syncVeil, 300);
window.__flowpy = { S, go, run, startScreen, startTopic, home, api };
})();
</script>
